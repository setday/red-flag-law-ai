[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "red-flag-law-ai"
version = "0.1.0"
description = "AI-powered system for automatic auditing of legal documents"
readme = "README.md"
authors = [
    {name = "Aleksandr Serkov", email = ""},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "transformers>=5.3.0",
    "datasets>=4.8.0",
    "trl>=0.29.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.8.0",
    "bert-score>=0.3.0",
    "pyyaml>=6.0.0",
    "hydra-core>=1.3.0",
    "tqdm>=4.67.0",
    "vllm>=0.18.0"
]

[project.urls]
Homepage = "https://github.com/setday/red-flag-law-ai"
Repository = "https://github.com/setday/red-flag-law-ai"
"Bug Tracker" = "https://github.com/setday/red-flag-law-ai/issues"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["src"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
