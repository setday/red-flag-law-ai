# Default Configuration for Red Flag Law AI

# Model configuration
model:
  name: "meta-llama/Llama-2-7b-hf"  # Base model for fine-tuning
  type: "causal_lm"  # causal language model
  max_length: 512
  load_in_8bit: false  # Use 8-bit quantization for memory efficiency
  load_in_4bit: false  # Use 4-bit quantization (QLoRA)

# Training configuration
training:
  output_dir: "./models/checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  warmup_steps: 100
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  fp16: true  # Use mixed precision training
  gradient_checkpointing: true
  optim: "adamw_torch"
  lr_scheduler_type: "cosine"

# LoRA configuration (for parameter-efficient fine-tuning)
lora:
  r: 16  # Rank of LoRA matrices
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "v_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# Data configuration
data:
  dataset_name: "lex_glue"
  dataset_config: "unfair_tos"
  train_split: "train"
  validation_split: "validation"
  test_split: "test"
  max_samples: null  # null for all samples
  cache_dir: "./data/cache"

# Inference configuration
inference:
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 256
  do_sample: true

# Evaluation configuration
evaluation:
  metrics:
    - "accuracy"
    - "f1_macro"
    - "precision_macro"
    - "recall_macro"
    - "bertscore"
  bertscore_model: "microsoft/deberta-xlarge-mnli"

# Logging configuration
logging:
  log_level: "INFO"
  log_dir: "./logs"
  use_wandb: false  # Set to true to use Weights & Biases
  wandb_project: "red-flag-law-ai"
  wandb_entity: null  # Your W&B username or team

# Seed for reproducibility
seed: 42
